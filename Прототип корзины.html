<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Прототип корзины</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&display=swap" rel="stylesheet">
<style>
:root{
  --main-text:#1E1E1E; --sub1:#4F4F4F; --sub2:#808080; --sub3:#BCBCBC;
  --ground:#FFFFFF; --sub-ground:#F7F7F7; --sub-ground2:#E3E4E4; --page:#EFEFEF;
  --primary:#80BA27; --accent:#F45500; --warn:#E88A01; --orange-soft:#FFECD7; --border:#E5E5E5;
  --desk-bg:#E4E5E7; --desk-fg:#3C4043; --desk-muted:#80868B; --desk-chip:#FFFFFF; --desk-hover:rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--desk-bg:#17181A;--desk-fg:#D7DADF;--desk-muted:#8A9099;--desk-chip:#2A2C30;--desk-hover:rgba(255,255,255,.06);color-scheme:dark}}
:root[data-theme="dark"]{--desk-bg:#17181A;--desk-fg:#D7DADF;--desk-muted:#8A9099;--desk-chip:#2A2C30;--desk-hover:rgba(255,255,255,.06);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--desk-bg);font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Inter Display","Inter","Segoe UI",Roboto,sans-serif;font-variation-settings:"opsz" 32;color:var(--main-text);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-synthesis:none;text-rendering:optimizeLegibility;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
svg{display:block;flex-shrink:0}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:48px}
.phone-wrap{position:relative;width:375px;height:812px;flex-shrink:0;transform-origin:center center}
.phone{position:relative;width:375px;height:812px;border-radius:24px;overflow:hidden;background:var(--page);box-shadow:0 30px 80px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.04)}
/* desktop screen list */
.nav-panel{width:220px;font-size:13px;line-height:18px;color:var(--desk-fg);flex-shrink:0}
.nav-panel h2{font-size:13px;font-weight:600;color:var(--desk-fg);margin-bottom:10px;letter-spacing:.2px}
.nav-panel button{display:block;width:100%;padding:7px 10px;border-radius:8px;color:var(--desk-fg);font-size:13px}
.nav-panel button:hover{background:var(--desk-hover)}
.nav-panel button.on{background:var(--desk-chip);color:var(--desk-fg);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.nav-panel p{margin-top:14px;font-size:12px;color:var(--desk-muted)}
button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:760px){.nav-panel{display:none}}
@media (max-width:500px){
  .stage{display:block}
  .phone-wrap{width:100vw;height:100dvh;transform:none!important}
  .phone{width:100%;height:100%;border-radius:0;box-shadow:none}
}

/* ===== screens ===== */
.screen{position:absolute;inset:0;background:var(--page);display:none;overflow:hidden}
.screen.active{display:block}
.screen.white{background:var(--ground)}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.stack{display:flex;flex-direction:column;align-items:center;gap:8px}

/* top navigation */
.topnav{position:absolute;left:0;top:0;width:375px;background:var(--ground);z-index:20;display:flex;flex-direction:column;align-items:center}
.topnav.round{border-radius:0 0 24px 24px}
.statusbar{width:100%;height:44px;display:flex;align-items:center;justify-content:space-between;padding:12px 12px 12px 24px}
.statusbar .time{width:54px;height:20px;font-family:"SF Pro Text",-apple-system,BlinkMacSystemFont,"Inter",sans-serif;font-variation-settings:normal;font-weight:600;font-size:15px;line-height:20px;letter-spacing:-.5px;text-align:center}
.navbar{position:relative;width:100%;height:56px;display:flex;align-items:center;gap:8px;padding:8px 16px}
.navbar .ttl{position:absolute;left:16.33%;right:16.33%;top:50%;transform:translateY(-50%);text-align:center;font-weight:600;font-size:16px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.navbar .sp{flex:1}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--sub-ground);display:flex;align-items:center;justify-content:center}
.segmented{width:343px;background:var(--sub-ground);border-radius:12px;padding:4px;display:flex}
.segmented button{flex:1;padding:8px;border-radius:12px;text-align:center;font-weight:500;font-size:14px;line-height:18px;color:var(--sub1);transition:background .15s,color .15s}
.segmented button.on{background:var(--ground);color:var(--main-text);filter:drop-shadow(0 4px 3px rgba(0,0,0,.08)) drop-shadow(0 0 1px rgba(0,0,0,.04))}

/* blocks */
.block{width:375px;background:var(--ground);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px}
.block.bs{border-radius:0 0 24px 24px;gap:8px;align-items:center}
.address{width:343px;background:var(--sub-ground);border-radius:16px;padding:12px 8px;display:flex;gap:12px;align-items:center}
.address .type{padding:8px}
.address .base{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap}
.address .l1{font-size:14px;line-height:18px;color:var(--sub1);max-width:100%;overflow:hidden;text-overflow:ellipsis}
.address .l2{font-weight:500;font-size:16px;line-height:20px}
.address .ctl{padding:10px;border-radius:12px}
.soft{background:var(--sub-ground);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;width:343px;font-weight:500;font-size:16px;line-height:20px;white-space:nowrap}
.soft.sm{padding:10px;gap:6px;width:100%}
.soft .right{flex:1;text-align:right;font-weight:400;opacity:.8}
.primary{background:var(--primary);color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;width:100%;font-weight:500;font-size:16px;line-height:20px;white-space:nowrap}
.primary .right{flex:1;text-align:right;font-weight:400}
.primary.disabled{background:#F0F1F3;color:var(--sub3);cursor:default}
.soft:active,.primary:not(.disabled):active,.icon-btn:active{filter:brightness(.96)}

.headline{width:343px;display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.headline .tg{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:2px 0}
.headline .t{font-weight:600;font-size:18px;line-height:22px}
.headline .s{font-size:14px;line-height:18px;color:var(--sub1)}
.counter{background:var(--sub-ground);border-radius:12px;padding:4px 8px;font-weight:600;font-size:13px;line-height:16px;white-space:pre;flex-shrink:0}
.counter.orange{background:var(--orange-soft)}
.counter.green{background:var(--primary);color:#F8F8F8}

/* product card */
.card{width:343px;padding:16px 0;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.card.g12{gap:12px}
.card .row{display:flex;gap:16px;align-items:flex-start}
.pimg{width:92px;height:92px;border-radius:16px;flex-shrink:0;background:var(--sub-ground) center/cover no-repeat;position:relative;overflow:hidden}
.faded{opacity:.5}
.card .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.card .name{font-weight:500;font-size:14px;line-height:18px}
.card .ctrls{display:flex;align-items:center;justify-content:space-between}
.addbtn{background:var(--sub-ground);border-radius:16px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.addbtn .main{display:flex;gap:8px;align-items:center}
.addbtn .main button{width:24px;height:24px;border-radius:6px}
.addbtn .q{width:40px;text-align:center;font-weight:500;font-size:14px;line-height:20px;color:#1E1E1E}
.addbtn .sub{font-size:12px;line-height:14px;color:#4F4F4F;white-space:nowrap}
.price{width:66px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center}
.price-wrap{padding:8px 0;display:flex;flex-direction:column;align-items:center}
.price .cost{display:flex;gap:4px;font-weight:600;font-size:16px;line-height:18px;white-space:nowrap}
.price .cost.accent{color:var(--accent)}
.price .old{position:relative;display:flex;gap:4px;font-size:14px;line-height:18px;color:var(--sub2);white-space:nowrap}
.price .old::after{content:"";position:absolute;left:-.5px;right:-.5px;top:50%;height:1px;background:var(--sub2);transform:translateY(.5px) rotate(-10.62deg)}
.cut{padding:12px 0;display:flex;gap:16px;align-items:center}
.cut .box{flex:1;display:flex;gap:8px;align-items:center;color:var(--sub1);white-space:nowrap}
.cut .box .a{font-weight:500;font-size:14px;line-height:18px}
.cut .box .b{font-weight:600;font-size:12px;line-height:14px;display:flex;gap:2px;width:24px}
.switch{width:52px;border-radius:60px;padding:3px;background:#E6E6E6;display:flex;align-items:center;transition:background .2s;flex-shrink:0}
.switch .knob{width:24px;height:24px;border-radius:24px;background:#fff;filter:drop-shadow(0 3px 2px rgba(0,0,0,.15)) drop-shadow(0 3px .25px rgba(0,0,0,.06));transition:transform .2s}
.switch.alt{background:var(--sub-ground2)}
.switch.alt .knob{filter:drop-shadow(0 3px 2px rgba(0,0,0,.08)) drop-shadow(0 2px .25px rgba(0,0,0,.04))}
.switch.on{background:var(--primary)}
.switch.on .knob{transform:translateX(22px)}
.promo{width:343px;background:var(--sub-ground);border-radius:16px;padding:0 8px;display:flex;flex-direction:column;align-items:center}
.promo .cs{width:100%;border-bottom:1px solid #EFEFEF;padding:8px 0 13px;display:flex;flex-direction:column;gap:8px}
.promo .hl{display:flex;gap:8px;align-items:center}
.promo .hl .t{flex:1;font-weight:500;font-size:14px;line-height:18px;white-space:pre-wrap}
.promo .d{font-size:13px;line-height:16px;color:var(--sub1)}
.promo .more{width:100%;display:flex;gap:8px;align-items:center;padding:12px 0}
.promo .more .t{flex:1;font-size:16px;line-height:20px;opacity:.8}
.promo .more .chev{transition:transform .2s}
.promo.open .more .chev{transform:rotate(180deg)}
.badge24{width:24px;height:24px;flex-shrink:0;background:center/24px 24px no-repeat}
.badge24.ev{background-color:var(--primary)}

.service{align-items:center}
.thumbs{display:flex;gap:4px;justify-content:center;width:343px}
.thumb{width:53.833px;height:53.833px;border-radius:8px;background:var(--sub-ground) center/cover no-repeat}

.separator{width:375px;padding:24px;display:flex;flex-direction:column;gap:8px}
.separator .t{font-weight:600;font-size:20px;line-height:24px}
.separator .s{font-weight:500;font-size:16px;line-height:20px;color:var(--sub1)}

.totals{align-items:center;gap:24px}
.totals .t{width:100%;font-weight:600;font-size:18px;line-height:22px}
.ot{width:345px;display:flex;flex-direction:column;gap:16px}
.ot .body,.ot .head{border-bottom:1px solid #EFEFEF;padding-bottom:24px;display:flex;flex-direction:column;gap:8px}
.ot .r{display:flex;justify-content:space-between;gap:24px;font-weight:500;font-size:14px;line-height:18px;white-space:nowrap}
.ot .head .big{display:flex;justify-content:space-between;font-weight:600;white-space:nowrap}
.ot .head .big span:first-child{font-size:18px;line-height:22px}
.ot .head .big span:last-child{font-size:20px;line-height:24px}
.green-t{color:var(--primary)} .accent-t{color:var(--accent)}
.note svg{width:16px;height:16px}
.note{width:345px;background:var(--sub-ground);border-radius:12px;padding:12px 16px;display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:16px;color:var(--sub1)}

/* bottom bar */
.bottombar{position:absolute;left:0;bottom:0;width:375px;background:#fff;border-radius:24px 24px 0 0;z-index:20;filter:drop-shadow(0 -4px 4px rgba(0,0,0,.04))}
.bottombar.flat{border-radius:0;filter:none;box-shadow:0 -4px 16px rgba(0,0,0,.04)}
.btnpanel{padding:16px;display:flex;flex-direction:column;gap:8px}
.tabs{display:flex;background:#fff}
.tab{flex:1;height:50px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;color:var(--sub2)}
.tab span{font-weight:600;font-size:10px;line-height:12px;text-align:center}
.tab.on{color:var(--primary)}
.tab .cnt{position:absolute;right:12px;top:4px;min-width:14px;height:14px;padding:1px;border:2px solid #fff;border-radius:60px;background:var(--accent);color:#fff;font-weight:400;font-size:10px;line-height:12px;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.tab .cnt b{font-weight:400;padding:0 1px}
.homeind{padding:22px 8px 8px;display:flex;justify-content:center;background:#fff}
.homeind i{width:134px;height:5px;border-radius:100px;background:var(--main-text)}

/* snackbar */
.snack{position:absolute;left:16px;right:16px;bottom:159px;z-index:25;background:rgba(0,0,0,.64);border-radius:12px;padding:16px;display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:16px;line-height:20px;transition:opacity .3s,transform .3s;opacity:0;transform:translateY(8px);pointer-events:none}
.snack.show{opacity:1;transform:none;pointer-events:auto}
.snack button{color:var(--primary);font-weight:500;flex-shrink:0}

/* settings */
.ask{width:375px;background:#fff;border-radius:24px;padding:16px}
.ask .row{display:flex;gap:16px;align-items:center}
.illu{width:56px;height:56px;border-radius:16px;background:var(--sub-ground) center/cover no-repeat;flex-shrink:0}
.ask .c{display:flex;flex-direction:column;gap:8px}
.ask .c .h{font-weight:600;font-size:20px;line-height:24px}
.ask .c .l{font-size:16px;line-height:22px;white-space:nowrap}
.plist{display:flex;flex-direction:column;gap:12px;width:100%}
.pitem{display:flex;gap:16px;align-items:flex-start}
.pitem .im{width:56px;height:56px;border-radius:12px;background:var(--sub-ground) center/cover no-repeat;flex-shrink:0}
.pitem .tx{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.pitem .tx p{font-weight:500;font-size:14px;line-height:18px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pitem .pr{align-self:stretch;display:flex;align-items:center;justify-content:flex-end}
.pitem .pr .in{width:45px;padding:8px 0;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.pitem .pr .p{display:flex;gap:4px;font-weight:600;font-size:16px;line-height:18px;white-space:nowrap}
.pitem .pr .q{font-weight:500;font-size:14px;line-height:20px;white-space:nowrap}
.sheetpanel{position:absolute;left:0;bottom:0;width:375px;border-radius:24px 24px 0 0;overflow:hidden;background:#fff;z-index:20;padding:0 16px;filter:drop-shadow(0 -4px 4px rgba(0,0,0,.04))}
.sheetpanel .btns{padding:16px 0;display:flex;flex-direction:column;gap:8px}
.sheetpanel .homeind{margin:0 -16px}

/* store list */
.banner{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:18px}
.banner.gray{background:var(--sub-ground);border-radius:12px;padding:8px}
.slist{width:375px;background:#fff;border-radius:24px;display:flex;flex-direction:column}
.store{padding:16px;border-radius:24px;display:flex;flex-direction:column;gap:12px;width:100%}
.store:active{background:#fafafa}
.shead{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.shead .tg{width:283px;display:flex;flex-direction:column;gap:2px;padding:2px 0}
.shead .t{font-weight:600;font-size:16px;line-height:22px}
.shead.lg .t{font-size:18px}
.shead .s{font-size:14px;line-height:18px;color:var(--sub1)}
.shead .s.warn{color:var(--warn)}
.sitem{width:343px;display:flex;gap:16px;align-items:center}
.sthumb{width:56px;height:56px;border-radius:8px;flex-shrink:0;position:relative;overflow:hidden;opacity:.5;background:#F7F7F7 center/cover no-repeat;display:flex;align-items:flex-end;justify-content:flex-end}
.chip{display:flex;align-items:flex-end}
.chip .el{display:flex;flex-direction:column;align-items:flex-end}
.chip .ic{background:#fff;border-top-left-radius:12px;padding:2px}
.sitem .tx{flex:1;min-width:0;display:flex;gap:12px;align-items:center;font-weight:500;font-size:14px}
.sitem .tx p{flex:1;line-height:18px}
.sitem .tx span{line-height:20px;white-space:nowrap}

/* map */
.map{position:absolute;left:0;top:120px;width:375px;overflow:hidden;background:#EEF0E8}
.map .mimg{position:absolute;background:center/cover no-repeat}
.zoom{position:absolute;display:flex;flex-direction:column;gap:8px;filter:drop-shadow(0 4px 3px rgba(0,0,0,.08)) drop-shadow(0 0 1px rgba(0,0,0,.04));color:var(--sub1);z-index:3}
.zoom button{width:40px;height:40px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center}
.pin{position:absolute;display:flex;align-items:center;z-index:2}
.pin .cb{margin-right:-12px;padding:8px 16px;border-radius:32px;background:#fff;font-weight:500;font-size:14px;line-height:18px;white-space:nowrap;filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.08)) drop-shadow(0 0 1px rgba(0,0,0,.04))}
.pin .cb.g{background:var(--primary);color:#fff}
.pin .shopimg{width:48px;height:48px;background:center/contain no-repeat;position:relative}
.pin .chk{border-radius:24px;overflow:hidden}
.storepin{position:absolute;display:flex;flex-direction:column;align-items:center;z-index:2;filter:drop-shadow(0 6px 4.5px rgba(0,0,0,.06)) drop-shadow(0 2px 2px rgba(0,0,0,.04)) drop-shadow(0 0 1px rgba(0,0,0,.02))}
.storepin .bx{background:var(--primary);padding:12px;border-radius:24px;margin-bottom:-4px}
.storepin .st{width:4px;height:24px;border-radius:24px;background:var(--primary)}
.msheet{position:absolute;left:0;width:375px;z-index:4}
.msheet .handle{display:flex;justify-content:center;padding:0 16px 8px}
.msheet .handle i{width:40px;height:4px;border-radius:8px;background:#C5C5C5}
.msheet .sh{background:#fff;border-radius:24px 24px 0 0;padding:16px 16px 24px;display:flex;flex-direction:column;gap:16px;max-height:460px;overflow:hidden}

/* checkout */
.dprev{width:343px;background:var(--sub-ground);border-radius:12px;padding:24px 16px;display:flex;flex-direction:column;gap:16px}
.dprev .r{display:flex;gap:12px;align-items:flex-start;font-weight:500;font-size:16px;line-height:20px}
.dprev .r>svg{width:20px;height:20px}
.dprev .r .bl{display:flex;gap:4px;align-items:baseline}
.dprev .r .bl small{font-weight:400;font-size:14px;line-height:18px;color:var(--sub1)}
.obtn{width:343px;background:var(--sub-ground);border-radius:12px;padding:16px;display:flex;gap:12px;align-items:flex-start;font-weight:500;font-size:16px;line-height:20px}
.obtn span{width:279px}
.friend{width:375px;background:#fff;border-radius:24px;padding:16px;display:flex;gap:8px;align-items:center}
.friend .lb{flex:1;display:flex;align-items:center;font-weight:500;font-size:16px;line-height:20px}
.friend .lb i{padding:8px;border-radius:12px;display:block}
.pay .h{font-weight:600;font-size:20px;line-height:24px}
.methods{display:flex;flex-direction:column;gap:4px}
.prow{width:343px;display:flex;gap:8px;align-items:center;padding:12px 0;background:#fff}
.prow.bb{border-bottom:1px solid var(--border)}
.prow .l{flex:1;min-width:0;display:flex;gap:12px;align-items:center;font-weight:500;font-size:16px;line-height:20px;white-space:nowrap}
.tag{background:#F7F7F7;border:1px solid #fff;border-radius:16px;padding:8px 12px 8px 8px;font-size:12px;line-height:14px;color:var(--sub1);white-space:nowrap}
.ghost{width:32px;padding:7px;border-radius:12px;display:flex;align-items:center;justify-content:center}

.fade-in{animation:fi .22s ease}
@keyframes fi{from{opacity:.4}to{opacity:1}}
</style>
<div class="stage">
  <div class="phone-wrap" id="wrap"><div class="phone" id="phone"></div></div>
  <div class="nav-panel" id="navpanel"></div>

const ic = (n, cls='') => ICONS[n] ? ICONS[n].replace('<svg', `<svg class="${cls}" aria-hidden="true"`) : '';
const bg = (k) => IMG[k] ? `style="background-image:url(${IMG[k]})"` : '';

/* ---------- shared pieces ---------- */
const statusbar = (time) => `<div class="statusbar"><div class="time">${time}</div>${ic('statusRight')}</div>`;
function topnav({title, time='16:41', round=false, back='back', trash=false, segmented=null, pb=0}){
  return `<div class="topnav ${round?'round':''}" style="padding-bottom:${pb}px">
    ${statusbar(time)}
    <div class="navbar">
      <button class="icon-btn" data-act="${back}" aria-label="Назад">${ic('back')}</button>
      <div class="ttl">${title}</div><div class="sp"></div>
      ${trash?`<button class="icon-btn" aria-label="Очистить корзину">${ic('trash')}</button>`:''}
    </div>
    ${segmented?`<div class="segmented">${segmented.map(([t,on,act])=>`<button class="${on?'on':''}" data-act="${act}">${t}</button>`).join('')}</div>`:''}
  </div>`;
}
function tabs({active='cart', count='6'}){
  const t=[['home','tabHome','Главная'],['catalog','tabCatalog','Каталог'],['promo','tabPromo','Акции'],['cart','tabCart','Корзина'],['profile','tabProfile','Профиль']];
  return `<div class="tabs">${t.map(([k,i,l])=>`<button class="tab ${k===active?'on':''}">${ic(i)}<span>${l}</span>${k==='cart'?`<div class="cnt"><b>${count}</b></div>`:''}</button>`).join('')}</div><div class="homeind"><i></i></div>`;
}
const priceHTML = (v, {accent=false, old=null, wrap=true}={}) => {
  const p = `<div class="price"><div class="cost ${accent?'accent':''}"><span>${v}</span><span>₽</span></div>${old?`<div class="old"><span>${old}</span><span>₽</span></div>`:''}</div>`;
  return wrap?`<div class="price-wrap">${p}</div>`:p;
};
function productCard(p){
  return `<div class="card ${p.g12?'g12':''}">
    <div class="row">
      <div class="pimg ${p.faded?'faded':''}" ${bg(p.img)}></div>
      <div class="col">
        <div class="name">${p.name}</div>
        <div class="ctrls">
          <div class="addbtn">
            <div class="main"><button data-qty="-" aria-label="Меньше">${ic('minus')}</button><span class="q" data-step="${p.step||1}" data-unit="${p.unit||'шт'}" data-val="${p.qv}">${p.q}</span><button data-qty="+" aria-label="Больше">${ic('plus')}</button></div>
            ${p.sub?`<div class="sub">${p.sub}</div>`:''}
          </div>
          ${priceHTML(p.price,{accent:p.accent,old:p.old,wrap:p.wrap!==false})}
        </div>
      </div>
    </div>
    ${p.extra||''}
  </div>`;
}

const SCREENS = [
  ['cartA','Корзина', ()=>cartScreen('A')],
  ['settings','Настройка корзины', settingsScreen],
  ['cartB','Корзина — дата изменена', ()=>cartScreen('B')],
  ['stores','Магазины — список', storesScreen],
  ['map','Магазины — карта', mapScreen],
  ['mapCurrent','Карта — текущий магазин', ()=>mapSheet(false)],
  ['mapSelect','Карта — выбор магазина', ()=>mapSheet(true)],
  ['cartC','Корзина — магазин изменён', ()=>cartScreen('C')],
  ['checkout','Оформление', checkoutScreen],
];
const phone = document.getElementById('phone');
SCREENS.forEach(([id,,fn])=>{const d=document.createElement('section');d.className='screen'+(id.startsWith('map')?' white':'');d.id='s-'+id;d.innerHTML=fn();phone.appendChild(d);});
let current='cartA', lastCart='cartA', snackTimer;
function go(id, {snack=false}={}){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active', s.id==='s-'+id));
  const el=document.getElementById('s-'+id); el.classList.add('fade-in'); setTimeout(()=>el.classList.remove('fade-in'),250);
  const sc=el.querySelector('.scroll'); if(sc) sc.scrollTop=0;
  if(id.startsWith('cart')) lastCart=id;
  current=id;
  document.querySelectorAll('#navpanel [data-go]').forEach(b=>b.classList.toggle('on', b.dataset.go===id));
  clearTimeout(snackTimer);
  document.querySelectorAll('[data-snack]').forEach(s=>s.classList.remove('show'));
  if(snack){const s=el.querySelector('[data-snack]'); if(s){requestAnimationFrame(()=>s.classList.add('show')); snackTimer=setTimeout(()=>s.classList.remove('show'),5000);}}
}
const ACT = {
  'settings':()=>go('settings'), 'cart':()=>go(lastCart), 'apply-date':()=>go('cartB',{snack:true}),
  'revert':()=>go('cartA'), 'undo-B':()=>go('cartA'), 'undo-C':()=>go('cartB'),
  'stores':()=>go('stores'), 'map':()=>go('map'), 'map-current':()=>go('mapCurrent'), 'map-select':()=>go('mapSelect'),
  'apply-store':()=>go('cartC',{snack:true}), 'checkout':()=>go('checkout'), 'back-from-checkout':()=>go(lastCart), 'noop':()=>{}
};
phone.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]'); if(a&&ACT[a.dataset.act]){ACT[a.dataset.act]();return;}
  const t=e.target.closest('[data-toggle]'); if(t){t.classList.toggle('on');return;}
  const m=e.target.closest('[data-more]'); if(m){const pr=m.closest('[data-promo]');pr.classList.toggle('open');pr.querySelector('.extra-promo').hidden=!pr.classList.contains('open');return;}
  const sg=e.target.closest('[data-seg] button'); if(sg){sg.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===sg));return;}
  const q=e.target.closest('[data-qty]'); if(q){const s=q.parentNode.querySelector('.q');const st=+s.dataset.step;let v=+s.dataset.val+(q.dataset.qty==='+'?st:-st);if(v<st)v=st;s.dataset.val=v;s.textContent=v+' '+s.dataset.unit;}
});
// desktop screen list
const np=document.getElementById('navpanel');
np.innerHTML='<h2>Экраны сценария</h2>'+SCREENS.map(([id,t],i)=>`<button data-go="${id}">${i+1}. ${t}</button>`).join('')+'<p>Нажимайте на кнопки в макете — переходы работают как в сценарии.</p>';
np.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go,{snack:b.dataset.go==='cartB'||b.dataset.go==='cartC'});});
// fit phone into viewport on desktop
function fit(){const w=document.getElementById('wrap');if(innerWidth<=500){w.style.transform='';return;}const s=Math.min(1,(innerHeight-32)/812);w.style.transform=`scale(${s})`;w.style.margin=`${(812*s-812)/2}px ${(375*s-375)/2}px`;}
addEventListener('resize',fit);fit();
go('cartA');
</script>
